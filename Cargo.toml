[package]
name = "herdr-handsfree"
version = "0.2.0"
edition = "2024"
description = "herdr plugin: voice dictation + webcam gaze mouse"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qwen3-asr = { version = "0.2.2", features = ["hub"] }
whisper-rs = { version = "0.16.0", features = ["metal"], optional = true }
hound = "3"
ureq = "2"
ort = "2.0.0-rc.10"
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }
nalgebra = "0.35.0"
core-graphics = "0.25.0"
image = "0.25.10"
toml = "1.1.3"

[features]
default = []
# Fall back to whisper.cpp for STT. Needs cmake + a C++ toolchain.
whisper = ["dep:whisper-rs"]

[profile.release]
lto = "thin"
