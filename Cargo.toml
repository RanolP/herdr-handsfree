[package]
name = "herdr-handsfree"
version = "0.1.0"
edition = "2024"
description = "herdr plugin: voice dictation + webcam gaze mouse"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
hound = "3"
ureq = "2"
ort = "2.0.0-rc.10"
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }
nalgebra = "0.35.0"
core-graphics = "0.25.0"
image = "0.25.10"
toml = "1.1.3"

[profile.release]
lto = "thin"
