id = "ranolp.handsfree"
name = "Handsfree"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Voice dictation into the focused pane + webcam gaze mouse"
platforms = ["macos"]

# Fetches the prebuilt binary (macOS arm64). To build from source instead
# (needs rust + cmake), run `cargo build --release` in the plugin dir.
[[build]]
command = ["sh", "-c", "mkdir -p target/release && curl -fsSL https://github.com/RanolP/herdr-handsfree/releases/download/v0.2.0/herdr-handsfree-v0.2.0-aarch64-apple-darwin.tar.gz | tar xz -C target/release"]

[[startup]]
command = ["target/release/herdr-handsfree", "ensure-daemon"]

[[actions]]
id = "toggle-dictation"
title = "Toggle voice dictation"
command = ["target/release/herdr-handsfree", "toggle", "dictation"]

[[actions]]
id = "toggle-gaze"
title = "Toggle gaze mouse"
command = ["target/release/herdr-handsfree", "toggle", "gaze"]

[[panes]]
id = "status"
title = "Handsfree status"
placement = "popup"
width = "60%"
height = 12
command = ["target/release/herdr-handsfree", "status", "--follow"]

[[panes]]
id = "calibrate"
title = "Calibrate gaze"
placement = "popup"
width = "60%"
height = 14
command = ["target/release/herdr-handsfree", "calibrate"]
